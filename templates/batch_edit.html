<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit batch</title>
  <style>
    :root { --green: #0f9d73; --green-dark: #0b7a58; --bg: #f1f6f4;
            --card: #fff; --text: #1d2b27; --muted: #6b7d77; --border: #d8e4e0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font-family: "Segoe UI", system-ui, Arial, sans-serif; }
    header { background: linear-gradient(135deg, var(--green), var(--green-dark));
             color: #fff; padding: 22px 16px 30px; text-align: center; }
    header h1 { margin: 0; font-size: 24px; }
    nav { margin-top: 12px; }
    nav a { color: #fff; text-decoration: none; padding: 7px 16px; margin: 0 4px;
            border-radius: 20px; background: rgba(255,255,255,.18); font-size: 14px; }
    nav a.active { background: #fff; color: var(--green-dark); font-weight: 700; }
    main { max-width: 720px; margin: -18px auto 40px; padding: 0 14px; }
    .card { background: var(--card); border-radius: 14px; padding: 18px 20px 22px;
            margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .card h2 { margin: 0 0 12px; font-size: 15px; text-transform: uppercase;
               letter-spacing: .6px; color: var(--green-dark); }
    .msg { background: #dcf5ea; border-left: 5px solid var(--green); padding: 12px 16px;
           border-radius: 10px; margin-bottom: 14px; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    input { width: 100%; padding: 11px 12px; font-size: 15px;
            border: 1.5px solid var(--border); border-radius: 9px; background: #fafcfb; }
    button { width: 100%; margin-top: 16px; padding: 15px; font-size: 17px; font-weight: 700;
             color: #fff; background: var(--green); border: none; border-radius: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Ushiri Pharmacy</h1>
    <nav>
      <a href="/sale">Sale</a>
      <a href="/stock-in">Stock In</a>
      <a href="/stock">Stock</a>
      <a href="/batches" class="active">Batches</a>
      <a href="/report">Report</a>
    </nav>
  </header>

  <main>
    {% for m in get_flashed_messages() %}
      <div class="msg">{{ m }}</div>
    {% endfor %}
    <div class="card">
      <h2>{{ batch.name }} {{ batch.strength }} &middot; batch {{ batch.batch_no }}</h2>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="grid">
          <div>
            <label>Batch number</label>
            <input name="batch_no" value="{{ batch.batch_no }}" required>
          </div>
          <div>
            <label>Expiry (YYYY-MM)</label>
            <input name="expiry" value="{{ batch.expiry }}" required>
          </div>
          <div>
            <label>Strips in stock</label>
            <input name="strips" type="number" min="0" value="{{ batch.strips }}" required>
          </div>
          <div>
            <label>Cost per box</label>
            <input name="cost_box" type="number" step="0.01" value="{{ batch.cost_box }}" required>
          </div>
          <div>
            <label>Sale price per box</label>
            <input name="sale_box" type="number" step="0.01" value="{{ batch.sale_box }}" required>
          </div>
          <div>
            <label>Distributor</label>
            <input name="distributor" value="{{ batch.distributor or '' }}">
          </div>
          <div>
            <label>Invoice number</label>
            <input name="invoice_no" value="{{ batch.invoice_no or '' }}">
          </div>
        </div>
        <button type="submit">Save batch</button>
      </form>
    </div>
  </main>
</body>
</html>
