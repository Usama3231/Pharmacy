<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error {{ code }}</title>
  <style>
    body { margin: 0; background: #f1f6f4; color: #1d2b27;
           font-family: "Segoe UI", system-ui, Arial, sans-serif; text-align: center; }
    main { max-width: 520px; margin: 80px auto; padding: 0 16px; }
    h1 { font-size: 64px; margin: 0; color: #0b7a58; }
    p { color: #6b7d77; }
    a { display: inline-block; margin-top: 16px; padding: 11px 18px; border-radius: 9px;
        background: #0f9d73; color: #fff; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>{{ code }}</h1>
    <p>{{ message }}</p>
    <a href="/">Back to the app</a>
  </main>
</body>
</html>
