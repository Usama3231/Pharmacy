<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock In</title>
  <style>
    :root {
      --green: #0f9d73;
      --green-dark: #0b7a58;
      --bg: #f1f6f4;
      --card: #ffffff;
      --text: #1d2b27;
      --muted: #6b7d77;
      --border: #d8e4e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
    }
    header {
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #fff;
      padding: 22px 16px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 24px; }
    header p { margin: 4px 0 0; opacity: .85; font-size: 14px; }

    nav { margin-top: 12px; }
    nav a {
      color: #fff;
      text-decoration: none;
      padding: 7px 16px;
      margin: 0 4px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .18);
      font-size: 14px;
    }
    nav a.active { background: #fff; color: var(--green-dark); font-weight: 700; }

    main { max-width: 760px; margin: -18px auto 40px; padding: 0 14px; }

    .msg {
      background: #dcf5ea;
      border-left: 5px solid var(--green);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px 20px 22px;
      margin-bottom: 14px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .06);
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--green-dark);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
    }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    small { color: var(--muted); font-weight: 400; }
    input {
      width: 100%;
      padding: 11px 12px;
      font-size: 15px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      background: #fafcfb;
      transition: border .15s, box-shadow .15s;
    }
    input:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(15, 157, 115, .18);
      background: #fff;
    }
    button {
      width: 100%;
      padding: 15px;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      background: var(--green);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background .15s, transform .05s;
    }
    button:hover { background: var(--green-dark); }
    button:active { transform: scale(.99); }
  </style>
</head>
<body>
  <header>
    <h1>Ushiri Pharmacy</h1>
    <p>Stock In &middot; record a new delivery</p>
    <nav>
      <a href="/sale">Sale</a>
      <a href="/stock-in" class="active">Stock In</a>
      <a href="/stock">Stock</a>
      <a href="/batches">Batches</a>
      <a href="/report">Report</a>

    </nav>
  </header>

  <main>
    {% for m in get_flashed_messages() %}
      <div class="msg">{{ m }}</div>
    {% endfor %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="card">
        <h2>Delivery</h2>
        <div class="grid">
          <div>
            <label>Distributor</label>
            <input name="distributor">
          </div>
          <div>
            <label>Invoice number</label>
            <input name="invoice_no">
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Medicine</h2>
        <div class="grid">
          <div>
            <label>Medicine name</label>
            <input name="name" list="meds" required autocomplete="off">
            <datalist id="meds">
              {% for m in medicines %}<option value="{{ (m['name'] ~ ' ' ~ m['strength'])|trim }}">{% endfor %}
            </datalist>
          </div>
          <div>
            <label>Strength <small>(e.g. 500mg, 120ml)</small></label>
            <input name="strength" autocomplete="off">
          </div>
          <div>
            <label>Company <small>(new medicines only)</small></label>
            <input name="company">
          </div>
          <div>
            <label>Strips per box <small>(new medicines only)</small></label>
            <input name="strips_per_box" type="number" min="1" value="1">
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Batch</h2>
        <div class="grid">
          <div>
            <label>Batch number</label>
            <input name="batch_no" required>
          </div>
          <div>
            <label>Expiry <small>(month and year)</small></label>
            <input name="expiry" type="month" required>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Quantity and prices</h2>
        <div class="grid">
          <div>
            <label>Quantity <small>(boxes on the bill)</small></label>
            <input name="qty" type="number" min="1" required>
          </div>
          <div>
            <label>Bonus <small>(extra boxes)</small></label>
            <input name="bonus" type="number" min="0" value="0">
          </div>
          <div>
            <label>Purchase price per box</label>
            <input name="cost_box" type="number" step="0.01" required>
          </div>
          <div>
            <label>Selling price per box</label>
            <input name="sale_box" type="number" step="0.01" required>
          </div>
        </div>
      </div>

      <button type="submit">Save to stock</button>
    </form>
  </main>

  <script>
    const meds = {{ medicines | tojson }};
    const nameBox = document.querySelector('[name=name]');

    nameBox.addEventListener('input', () => {
      const typed = nameBox.value.trim().toLowerCase();
      const m = meds.find(x => (x.name + ' ' + x.strength).trim().toLowerCase() === typed);
      if (!m) return;
      nameBox.value = m.name;
      document.querySelector('[name=strength]').value = m.strength;
      document.querySelector('[name=company]').value = m.company || '';
      document.querySelector('[name=strips_per_box]').value = m.strips_per_box;
      document.querySelector('[name=sale_box]').value = m.sale_box;
    });
  </script>
</body>
</html>
