<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sale</title>
  <style>
    :root { --green: #0f9d73; --green-dark: #0b7a58; --bg: #f1f6f4;
            --card: #fff; --text: #1d2b27; --muted: #6b7d77; --border: #d8e4e0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font-family: "Segoe UI", system-ui, Arial, sans-serif; }
    header { background: linear-gradient(135deg, var(--green), var(--green-dark));
             color: #fff; padding: 22px 16px 30px; text-align: center; }
    header h1 { margin: 0; font-size: 24px; }
    nav { margin-top: 12px; }
    nav a { color: #fff; text-decoration: none; padding: 7px 16px; margin: 0 4px;
            border-radius: 20px; background: rgba(255,255,255,.18); font-size: 14px; }
    nav a.active { background: #fff; color: var(--green-dark); font-weight: 700; }
    main { max-width: 900px; margin: -18px auto 40px; padding: 0 14px; }
    .card { background: var(--card); border-radius: 14px; padding: 16px;
            margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .row { display: flex; gap: 10px; }
    input { width: 100%; padding: 11px 12px; font-size: 15px;
            border: 1.5px solid var(--border); border-radius: 9px; background: #fafcfb; }
    input:focus { outline: none; border-color: var(--green);
                  box-shadow: 0 0 0 3px rgba(15,157,115,.18); }
    button { cursor: pointer; border: none; border-radius: 9px; font-size: 15px; }
    .add { background: var(--green); color: #fff; padding: 0 22px; font-weight: 700; }
    .wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; color: var(--muted); font-size: 12px; text-transform: uppercase;
         padding: 8px 6px; border-bottom: 2px solid var(--border); }
    td { padding: 8px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td input { width: 80px; padding: 7px; }
    td small { color: var(--muted); }
    .mode { padding: 7px 14px; font-weight: 700; background: #dcf5ea; color: var(--green-dark); }
    .mode.strip { background: #fff1d6; color: #a15c07; }
    .x { background: none; color: #b42318; font-size: 20px; }
    .total { display: flex; justify-content: space-between; align-items: center;
             font-size: 22px; font-weight: 700; margin-top: 14px; }
    .done { width: 100%; margin-top: 12px; padding: 15px; font-size: 17px;
            font-weight: 700; color: #fff; background: var(--green); }
    .done:hover { background: var(--green-dark); }
    .empty { text-align: center; color: var(--muted); padding: 18px; }
  </style>
</head>
<body>
  <header>
    <h1> Ushiri Pharmacy </h1>
    <nav>
      <a href="/sale" class="active">Sale</a>
      <a href="/stock-in">Stock In</a>
      <a href="/stock">Stock</a>
      <a href="/batches">Batches</a>
      <a href="/report">Report</a>

    </nav>
  </header>

  <main>
    <div class="card">
     <input id="customer" placeholder="Customer name (optional)" autocomplete="off" style="margin-bottom:10px">

      <div class="row">
        <input id="search" list="meds" placeholder="Search medicine..." autocomplete="off">
        <button class="add" onclick="addItem()">Add</button>
      </div>
      <datalist id="meds">
        {% for m in medicines %}<option value="{{ (m['name'] ~ ' ' ~ m['strength'])|trim }}">{% endfor %}
      </datalist>
    </div>

    <div class="card">
      <div class="wrap">
        <table>
          <thead>
            <tr><th>Medicine</th><th>Sold as (tap)</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr>
          </thead>
          <tbody id="lines"></tbody>
        </table>
      </div>
      <div class="total"><span>Total</span><span id="total">0.00</span></div>
      <button class="done" onclick="completeSale()">Complete sale</button>
    </div>
  </main>

  <script>
    const meds = {{ medicines | tojson }};
    let cart = [];
    const searchBox = document.getElementById('search');
    const label = m => (m.name + ' ' + m.strength).trim();

    searchBox.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

    function addItem() {
      const typed = searchBox.value.trim().toLowerCase();
      const m = meds.find(x => label(x).toLowerCase() === typed);
      if (!m) { alert('Pick a medicine from the suggestions.'); return; }
      const existing = cart.find(c => c.id === m.id);
      if (existing) existing.qty += 1;
      else cart.push({ id: m.id, mode: 'box', qty: 1 });
      searchBox.value = '';
      render();
      searchBox.focus();
    }

    function toggleMode(i) { cart[i].mode = cart[i].mode === 'box' ? 'strip' : 'box'; render(); }
    function setQty(i, v) { cart[i].qty = Math.max(1, parseInt(v) || 1); render(); }
    function removeLine(i) { cart.splice(i, 1); render(); }

    function render() {
      const body = document.getElementById('lines');
      body.innerHTML = '';
      let total = 0;
      if (!cart.length) {
        body.innerHTML = '<tr><td colspan="6" class="empty">Search a medicine and press Add.</td></tr>';
      }
      cart.forEach((c, i) => {
        const m = meds.find(x => x.id === c.id);
        const price = c.mode === 'box' ? m.price_box : m.price_box / m.strips_per_box;
        const line = price * c.qty;
        total += line;
        const tr = document.createElement('tr');
        tr.innerHTML =
          `<td><b>${m.name}</b> <small>${m.strength}</small></td>` +
          `<td><button class="mode ${c.mode}" onclick="toggleMode(${i})">${c.mode === 'box' ? 'Box' : 'Strip'}</button></td>` +
          `<td><input type="number" min="1" value="${c.qty}" onchange="setQty(${i}, this.value)"></td>` +
          `<td>${price.toFixed(2)}</td><td>${line.toFixed(2)}</td>` +
          `<td><button class="x" onclick="removeLine(${i})">&times;</button></td>`;
        body.appendChild(tr);
      });
      document.getElementById('total').textContent = total.toFixed(2);
    }

    async function completeSale() {
      if (!cart.length) { alert('The bill is empty.'); return; }
      const res = await fetch('/sell', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': '{{ csrf_token() }}' },
        body: JSON.stringify({ lines: cart, customer: document.getElementById('customer').value })      });
      const data = await res.json();
      if (!res.ok) { alert(data.error); return; }
      alert('Sale completed. Total: ' + data.total.toFixed(2));
      location.reload();
    }

    render();
  </script>
</body>
</html>
